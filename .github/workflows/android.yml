name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "dist/**", ".github/workflows/android.yml", "tools/android-smoke.sh"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test game logic and models
        run: npm test
      - name: Build development APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../A-Ultima-Luz-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: A-Ultima-Luz-Android
          path: A-Ultima-Luz-dev.apk
          retention-days: 30
  offline-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: A-Ultima-Luz-Android
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-check
          path: android-check/
